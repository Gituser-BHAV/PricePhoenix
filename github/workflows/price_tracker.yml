name: PricePhoenix

on:
  workflow_dispatch:
    inputs:
      mock_mode:
        description: "Use simulated prices (recommended for first run)"
        required: true
        type: boolean
        default: true
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: pricephoenix-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Run tracker
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          ALERT_TO_EMAIL: ${{ secrets.ALERT_TO_EMAIL }}
          EMAIL_ENABLED: ${{ vars.EMAIL_ENABLED || 'false' }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.mock_mode }}" = "true" ]; then
            python -m src.main --mock
          else
            python -m src.main
          fi

      - name: Commit updated history and alert state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/price_history.csv data/alert_state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update tracked price history"
            git push
          fi
